# Include this file inside Nginx's top-level `http { ... }` block.
#
# It uses the client address seen by the public Nginx edge. If another reverse
# proxy is placed in front of Nginx, configure `real_ip_header` and restricted
# `set_real_ip_from` entries before this include so `$remote_addr` cannot be
# forged by an Internet client.
geoip2 /var/lib/GeoIP/GeoLite2-City.mmdb {
    auto_reload 5m;

    $autocall_geo_city default="" city names en;
    $autocall_geo_country default="" country iso_code;
    $autocall_geo_region default="" subdivisions 0 names en;
}

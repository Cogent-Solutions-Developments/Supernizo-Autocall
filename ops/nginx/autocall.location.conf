# Add these locations inside the existing TLS server block for
# api.infrastructuresg.com. Keep the existing `location /` for leadgen.

location = /autocall-db {
    # Next.js canonicalizes the root WITHOUT a trailing slash. Proxy it
    # directly; redirecting to /autocall-db/ creates a two-way 308 loop.
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Geo-City "";
    proxy_set_header X-Geo-Country "";
    proxy_set_header X-Geo-Region "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /autocall-db/ {
    # No trailing slash: preserve /autocall-db for the Next.js basePath.
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # This Nginx instance is the direct public edge, so overwrite any
    # client-supplied forwarding chain instead of appending to it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    # The application derives approximate location from the overwritten
    # X-Real-IP value. Never pass client-supplied geolocation headers through.
    proxy_set_header X-Geo-City "";
    proxy_set_header X-Geo-Country "";
    proxy_set_header X-Geo-Region "";

    # Required by SSE/realtime responses.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

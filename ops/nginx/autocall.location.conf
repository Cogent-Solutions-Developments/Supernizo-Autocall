# Add these locations inside the existing TLS server block for
# api.infrastructuresg.com. Keep the existing `location /` for leadgen.

location = /autocall-db {
    return 308 /autocall-db/;
}

location ^~ /autocall-db/ {
    # No trailing slash: preserve /autocall-db for the Next.js basePath.
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # This Nginx instance is the direct public edge, so overwrite any
    # client-supplied forwarding chain instead of appending to it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    # GeoIP values are calculated at the trusted public Nginx edge. Do not
    # pass client-supplied X-Geo-* request headers through to the application.
    proxy_set_header X-Geo-City $autocall_geo_city;
    proxy_set_header X-Geo-Country $autocall_geo_country;
    proxy_set_header X-Geo-Region $autocall_geo_region;

    # Required by SSE/realtime responses.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
